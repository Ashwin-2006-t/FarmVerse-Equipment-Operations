server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: farmverse-equipment
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:farmverse_equipment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "FarmVerseNexusSecretKeyForJWTAuthentication2026AgriculturalOperationsSuperSecret"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.farmverse.equipment: DEBUG
    org.hibernate.SQL: INFO

